<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한미그룹 2026년 하반기 공개채용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E60012;
    --red-light: #FF5D32;
    --black: #000000;
    --white: #FFFFFF;
    --white-10: rgba(255, 255, 255, 0.1);
    --white-50: rgba(255, 255, 255, 0.5);
    --font: 'Inter', 'Noto Sans KR', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --container: 1440px;
    --transition: 0.2s ease;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--black);
    background: var(--white);
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; transition: color var(--transition), background var(--transition), border-color var(--transition); }
  ul { list-style: none; margin: 0; padding: 0; }
  h1, h2, p { margin: 0; }
  button { font-family: inherit; cursor: pointer; }

  .inner {
    width: 100%;
    max-width: var(--container);
    margin: 0 auto;
  }

  /* ===== Header ===== */
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 100px;
    z-index: 10;
  }
  .header .inner {
    height: 100px;
    padding: 0 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo { display: block; width: 182px; height: 31px; flex: none; }
  .logo img { display: block; width: 182px; height: 31px; }

  .gnb { display: flex; align-items: center; height: 100px; }
  .gnb-list { display: flex; gap: 40px; height: 100px; }
  .gnb-list li { display: flex; align-items: center; height: 100px; }
  .gnb-list a {
    font-size: 19px;
    font-weight: 600;
    line-height: 20px;
    letter-spacing: -0.4px;
    color: var(--black);
  }
  .gnb-list a:hover, .gnb-list a:focus-visible { color: var(--red); }

  .gnb-apply { padding-left: 40px; }

  /* ===== Buttons ===== */
  .btn-apply {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 48px;
    padding: 0 20px;
    border: 1px solid var(--red);
    border-radius: 500px;
    background: var(--red);
    color: var(--white);
    font-size: 17.4px;
    font-weight: 600;
    line-height: 18px;
    letter-spacing: -0.36px;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
  }
  .btn-apply svg { width: 7px; height: 12px; flex: none; }
  .btn-apply svg path { stroke: currentColor; }
  .btn-apply:hover, .btn-apply:focus-visible { background: var(--white); color: var(--red); }

  .btn-cta {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 303px;
    max-width: 100%;
    height: 72px;
    padding: 0 64px;
    border: 2px solid transparent;
    border-radius: 500px;
    background: linear-gradient(90deg, var(--red) 0%, var(--red-light) 100%) padding-box;
    color: var(--white);
    font-size: 22.7px;
    font-weight: 600;
    line-height: 34px;
    letter-spacing: -0.48px;
    white-space: nowrap;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
  }
  .btn-cta:hover, .btn-cta:focus-visible {
    background: var(--white);
    color: var(--red);
    border-color: var(--red);
  }

  /* ===== Main Visual ===== */
  .main-visual {
    position: relative;
    height: 900px;
    min-height: 720px;
    overflow: hidden;
    background: #FFF1EB url('./images/mv_bg.png') center / cover no-repeat;
    isolation: isolate;
  }
  .main-visual > .inner {
    position: relative;
    height: 100%;
  }

  /* Text */
  .mv-text {
    position: absolute;
    left: 100px;
    top: 50%;
    transform: translateY(-50%);
    width: 560px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 80px;
    z-index: 3;
  }
  .mv-info { display: flex; flex-direction: column; gap: 31.9px; }
  .mv-season {
    font-size: 31px;
    font-weight: 700;
    line-height: 45px;
    letter-spacing: -0.64px;
  }
  .mv-title { display: flex; flex-direction: column; }
  .mv-title .emphasis {
    font-size: 72px;
    font-weight: 800;
    line-height: 76px;
    letter-spacing: -1.76px;
  }
  .mv-title .sub {
    font-size: 46px;
    font-weight: 800;
    line-height: 72px;
    letter-spacing: -1.12px;
  }
  .mv-period {
    font-size: 19.2px;
    font-weight: 500;
    line-height: 28px;
    letter-spacing: -0.4px;
  }

  /* Visual stage (1440 x 900 reference coordinates) */
  .mv-stage {
    position: absolute;
    left: 0;
    top: 50%;
    width: 1440px;
    height: 900px;
    transform: translateY(-50%);
    z-index: 1;
    pointer-events: none;
  }
  .mv-stage img, .mv-stage span { position: absolute; display: block; max-width: none; }

  .mv-ring-glow {
    width: 663px; height: 663px;
    left: 700px; top: 118px;
    border: 5px solid var(--white);
    border-radius: 500px;
    background: radial-gradient(70.71% 70.71% at 50% 50%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
    filter: blur(5px);
  }
  .mv-ring {
    width: 553px; height: 553px;
    left: 755px; top: 173px;
    border: 1px solid var(--white-50);
    border-radius: 500px;
  }

  .mv-micro  { width: 289.52px; height: 221.76px; left: 862.4px;  top: 124.08px; }
  .mv-char1  { width: 253.44px; height: 395.12px; left: 911.68px; top: 267.52px; }
  .mv-char2  { width: 181.28px; height: 381.04px; left: 1133.44px; top: 265.76px; }
  .mv-char3  { width: 216.48px; height: 262.24px; left: 836px;    top: 441.76px; }
  .mv-char4  { width: 292.16px; height: 206.8px;  left: 1192.4px; top: 462.88px; }

  .mv-star1 { width: 17.6px;  height: 16.72px; left: 1018.16px; top: 209.44px; }
  .mv-star2 { width: 22.88px; height: 23.76px; left: 836.88px;  top: 441.76px; }
  .mv-star3a { width: 21.12px; height: 21.12px; left: 1411.52px; top: 447.04px; }
  .mv-star3b { width: 34.32px; height: 35.2px;  left: 1429.12px; top: 404.8px; }
  .mv-star4 { width: 23.76px; height: 24.64px; left: 1257.52px; top: 221.76px; }

  /* Scroll button */
  .btn-scroll {
    position: absolute;
    left: 50%;
    bottom: 64px;
    transform: translateX(-50%);
    width: 80px; height: 80px;
    padding: 0;
    border: 0;
    border-radius: 500px;
    background: var(--white-10);
    box-shadow: inset 4px 4px 10px rgba(255,255,255,0.4), inset -4px -4px 10px rgba(0,0,0,0.1);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
    transition: background var(--transition);
  }
  .btn-scroll::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 500px;
    background: linear-gradient(132.3deg, rgba(255,255,255,0.8) 12.7%, rgba(255,255,255,0) 86.3%);
    z-index: -1;
  }
  .btn-scroll svg { width: 40px; height: 40px; }
  .btn-scroll svg path { stroke: var(--white); transition: stroke var(--transition); }
  .btn-scroll:hover { background: var(--white); }
  .btn-scroll:hover svg path { stroke: var(--red); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ===== Responsive (콘텐츠 1440 미만) ===== */
  @media (max-width: 1439px) {
    .mv-stage { left: auto; right: 0; transform-origin: right center; transform: translateY(-50%) scale(0.8); }
  }
  @media (max-width: 1100px) {
    .gnb-list { display: none; }
    .gnb-apply { padding-left: 0; }
    .mv-text { left: 40px; }
    .mv-stage { opacity: 0.35; }
  }
  @media (max-width: 640px) {
    .header .inner { padding: 0 20px; }
    .mv-text { left: 20px; right: 20px; width: auto; gap: 48px; }
    .mv-title .emphasis { font-size: 52px; line-height: 60px; }
    .mv-title .sub { font-size: 34px; line-height: 52px; }
    .btn-cta { width: 260px; height: 60px; font-size: 19px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="inner">
    <a href="./" class="logo" aria-label="Hanmi 한미그룹 홈">
      <img src="./images/logo.svg" alt="Hanmi 한미그룹" width="182" height="31">
    </a>
    <nav class="gnb" aria-label="주요 메뉴">
      <ul class="gnb-list">
        <li><a href="#jobs">직무소개</a></li>
        <li><a href="#qualification">지원자격 및 접수방법</a></li>
        <li><a href="#schedule">채용설명회 일정</a></li>
      </ul>
      <div class="gnb-apply">
        <a href="#apply" class="btn-apply">
          지원하기
          <svg viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M1 1l5 5-5 5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </nav>
  </div>
</header>

<main>
  <section class="main-visual" id="main_visual" aria-label="2026년 하반기 한미그룹 공개채용">
    <div class="inner">

      <!-- 캐릭터/장식 스테이지 -->
      <div class="mv-stage" aria-hidden="true">
        <span class="mv-ring-glow"></span>
        <span class="mv-ring"></span>
        <img class="mv-micro" src="./images/mv_micro.png" alt="">
        <img class="mv-char1" src="./images/mv_char1.png" alt="">
        <img class="mv-char2" src="./images/mv_char2.png" alt="">
        <img class="mv-char3" src="./images/mv_char3.png" alt="">
        <img class="mv-char4" src="./images/mv_char4.png" alt="">
        <img class="mv-star1" src="./images/mv_star1.png" alt="">
        <img class="mv-star2" src="./images/mv_star2.png" alt="">
        <img class="mv-star3a" src="./images/mv_star3.png" alt="">
        <img class="mv-star3b" src="./images/mv_star3.png" alt="">
        <img class="mv-star4" src="./images/mv_star4.png" alt="">
      </div>

      <!-- 텍스트 -->
      <div class="mv-text">
        <div class="mv-info">
          <p class="mv-season">2026년 하반기</p>
          <h1 class="mv-title">
            <span class="emphasis">한미그룹</span>
            <span class="sub">공개채용</span>
          </h1>
          <p class="mv-period">모집기간 : 2026.9.28(월) ~ 2026.10.18(일) 23:59까지</p>
        </div>
        <a href="#jobs" class="btn-cta">모집직무 바로가기!</a>
      </div>

    </div>

    <button type="button" class="btn-scroll" id="scrollDown" aria-label="아래로 스크롤">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M12 16l8 8 8-8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </section>
</main>

<script>
  (function () {
    var btn = document.getElementById('scrollDown');
    var visual = document.getElementById('main_visual');
    if (btn && visual) {
      btn.addEventListener('click', function () {
        window.scrollTo({ top: visual.offsetHeight, behavior: 'smooth' });
      });
    }
  })();
</script>
</body>
</html>
