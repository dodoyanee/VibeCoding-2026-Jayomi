<!DOCTYPE html>
<html>
<head>
    <title>산리오 코리아 홍홍</title>
    <meta charset="UTF-8">
    <!-- 인터널스타일시트(internal style sheet) -->
    <!-- 상단영역 스타일 (Top Area Styles) -->
    <style>
        /* .top-area {
            상단 영역 전체에 필요한 공통 스타일을 여기에 추가하세요
        } */
        .top-inner {
            max-width: 1440px; /* 최대 너비 지정 */
            margin: 0 auto; /* 가운데 정렬 */
            display: flex; /* 가로 레이아웃을 위한 flex 사용 */
            align-items: center; /* 세로 중앙 정렬 */
            justify-content: space-between; /* 양끝 정렬 */
            height: 90px; /* 높이 지정 */
        }
        .logo-box {
            flex: 0 0 auto; /* 크기가 고정된 flex 아이템 */
        }
        .logo-box img {
            height: 56px; /* 로고 이미지 높이 고정 */
        }
        .menu-list {
            flex: 0 0 auto; /* 크기 고정 */
            display: flex; /* 가로로 나열 */
            gap: 48px; /* 메뉴 아이템 간 간격 */
            list-style: none; /* 기본 리스트 마커 제거 */
            padding: 0; /* 패딩 제거 */
            margin: 0; /* 마진 제거 */
            font-size: 1.12rem; /* 폰트 크기 */
            font-family: 'Pretendard', sans-serif; /* 폰트 지정 */
            font-weight: 500; /* 폰트 두께 */
        }
        .menu-list li a {
            color: inherit; /* 글자색 상속 */
            text-decoration: none; /* 밑줄 제거 */
        }
        
        .main-area {
            background: url('./images/main_visual_bg.jpg') repeat 0 0/50px;
        }
                /* 배너영역 스타일 */
        .banner-area {
            padding: 80px;
            position: relative;
        }
        .sns {
            display: flex; 
            flex-direction: column; 
            position: absolute; 
            top: 50px; 
            right: 50px;
        }
        .banner-area .center-banner {
            text-align: center;
            /* display: flex;
            justify-content: center;
            align-items: center; */
        }
        .banner-area .main-visual-img {
            /* display: block; */
            max-width: 100%;
            width: 984px;
        }
    </style>
</head>
<body>
<main class="wrapper">
    <!-- 1. 상단영역 -->     
    <header class="top-area">
        <!-- 상단영역 내용 -->
        <div class="top-inner">
            <!-- 로고이미지박스 (왼쪽 끝) -->
            <div class="logo-box">
                <img src="./images/logo_2023.png" alt="산리오코리아 로고">
            </div>
            <!-- 메뉴리스트 (오른쪽 끝) -->
            <nav>
                <ul class="menu-list">
                    <li><a href="#company">company</a></li>
                    <li><a href="#character">character</a></li>
                    <li><a href="#place">place</a></li>
                    <li><a href="#recruit">recruit</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <!-- 2. 메인영역 -->
    <section class="main-area">
        <!-- 배경스타일 사용법:
        background: 색 이 반 고 윙/크
        background: 배경색 이미지 반복 고정 위치/크기 -->
        <!-- 2-1. 배너영역 -->
        <section class="banner-area">
            <!-- 배너영역 내용 -->
            <div class="center-banner">
                <img src="./images/main_visual_pc_v1.png" alt="메인 비주얼" class="main-visual-img">
            </div>

                        <!-- SNS 이동 버튼 박스 -->
            <div class="sns">
				<a href="https://www.instagram.com/sanrio_kr/" target="_blank"><img src="./images/i_ins_pc_v3.png" alt="instargram"></a>
				<a href="https://www.youtube.com/c/sanriokorea/featured" target="_blank"><img src="./images/i_you_pc_v3.png" alt="youtube"></a>
			</div>    
        </section>
        <!-- 2-2. 캐릭터영역 -->
        <section class="character-area">
            <!-- 캐릭터영역 내용 -->
        </section>
        <!-- 2-3. 컴퍼니영역 -->
        <section class="company-area">
            <!-- 컴퍼니영역 내용 -->
        </section>
        <!-- 2-4. 리쿠르트영역 -->
        <section class="recruit-area">
            <!-- 리쿠르트영역 내용 -->
        </section>
        <!-- 2-5. 플레이스영역 -->
        <section class="place-area">
            <!-- 플레이스영역 내용 -->
        </section>
        <!-- 2-6. 컨텍어스영역 -->
        <section class="contactus-area">
            <!-- 컨텍어스영역 내용 -->
        </section>
    </section>
    <!-- 3. 하단영역 -->
    <footer class="bottom-area">
        <!-- 하단영역 내용 -->
    </footer>
</main>
</body>
</html>
