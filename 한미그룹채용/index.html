<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- <link rel="icon" type="image/png" href="./images/icon_favicon.png"> -->
<title>한미그룹 2026년 하반기 공개채용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>

  /* CSS 변수구역 */
  /* :root{변수코드}
  
    1. 변수 설정 방법
    --변수명: 값;
    변수명은 케밥케이스로 주로 씀
    (케밥케이스란? 마이너스 기호로 연결된 변수법)

    2. 변수 호출방법
    var(변수명)
    쓰고 싶은 곳에 값으로 변수를 사용함
  */

  :root {
    --red: #E60012;
    --red-light: #FF5D32;
    --black: #000000;
    --white: #FFFFFF;
    --white-10: rgba(255, 255, 255, 0.1);
    --white-50: rgba(255, 255, 255, 0.5);
    --font: 'Inter', 'Noto Sans KR', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --container: 1440px;
    --transition: 0.2s ease;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--black);
    background: var(--white);
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; transition: color var(--transition), background var(--transition), border-color var(--transition); }
  ul { list-style: none; margin: 0; padding: 0; }
  h1, h2, p { margin: 0; }
  button { font-family: inherit; cursor: pointer; }

  .inner {
    width: 100%;
    max-width: var(--container);
    margin: 0 auto;
  }

  /* ===== Header ===== */
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 100px;
    z-index: 10;
  }

  .header .inner {
    height: 100px;
    padding: 0 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    /* max-width: var(--container-width); */
  }
  .logo { display: block; width: 182px; height: 31px; flex: none; }
  .logo img { display: block; width: 182px; height: 31px; }

  .gnb { display: flex; align-items: center; height: 100px; }
  .gnb-list { display: flex; gap: 40px; height: 100px; }
  .gnb-list li { display: flex; align-items: center; height: 100px; }
  .gnb-list a {
    font-size: 19px;
    font-weight: 600;
    line-height: 20px;
    letter-spacing: -0.4px;
    color: var(--black);
  }
  .gnb-list a:hover, .gnb-list a:focus-visible { color: var(--red); }

  .gnb-apply { padding-left: 40px; }

  /* 모바일 전용 요소 (데스크탑·태블릿에서는 숨김) */
  .header-m, .btn-close { display: none; }

  /* ===== Buttons ===== */
  .btn-apply {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 48px;
    padding: 0 20px;
    border: 1px solid var(--red);
    border-radius: 500px;
    background: var(--red);
    color: var(--white);
    font-size: 17.4px;
    font-weight: 600;
    line-height: 18px;
    letter-spacing: -0.36px;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
  }
  .btn-apply svg { width: 7px; height: 12px; flex: none; }
  .btn-apply svg path { stroke: currentColor; }
  .btn-apply:hover, .btn-apply:focus-visible { background: var(--white); color: var(--red); }

  .btn-cta {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 303px;
    max-width: 100%;
    height: 72px;
    padding: 0 64px;
    border: 2px solid transparent;
    border-radius: 500px;
    background: linear-gradient(90deg, var(--red) 0%, var(--red-light) 100%) padding-box;
    color: var(--white);
    font-size: 22.7px;
    font-weight: 600;
    line-height: 34px;
    letter-spacing: -0.48px;
    white-space: nowrap;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
  }
  .btn-cta:hover, .btn-cta:focus-visible {
    background: var(--white);
    color: var(--red);
    border-color: var(--red);
  }

  /* ===== Main Visual ===== */
  .main-visual {
    position: relative;
    height: 900px;
    min-height: 720px;
    overflow: hidden;
    background: #FFF1EB url('./images/mv_bg.png') center / cover no-repeat;
    isolation: isolate;
  }
  .main-visual > .inner {
    position: relative;
    height: 100%;
  }

  /* Text */
  .mv-text {
    position: absolute;
    left: 100px;
    top: 50%;
    transform: translateY(-50%);
    width: 560px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 80px;
    z-index: 3;
  }
  .mv-info { display: flex; flex-direction: column; gap: 31.9px; }
  .mv-season {
    font-size: 31px;
    font-weight: 700;
    line-height: 45px;
    letter-spacing: -0.64px;
  }
  .mv-title { display: flex; flex-direction: column; }
  .mv-title .emphasis {
    font-size: 72px;
    font-weight: 800;
    line-height: 76px;
    letter-spacing: -1.76px;
  }
  .mv-title .sub {
    font-size: 46px;
    font-weight: 800;
    line-height: 72px;
    letter-spacing: -1.12px;
  }
  .mv-period {
    font-size: 19.2px;
    font-weight: 500;
    line-height: 28px;
    letter-spacing: -0.4px;
  }

  /* Visual stage: 1440 x 900 기준 좌표를 내부 박스 폭에 비례해 축소 */
  .mv-stage {
    position: absolute;
    /* 마지막 캐릭터의 오른쪽 끝(1484.56px)이 화면 밖으로 나가지 않도록 보정 */
    left: min(0px, calc((100vw - 100%) / 2 - 44.56 / 1440 * 100%));
    top: 50%;
    width: 100%;
    height: auto;
    aspect-ratio: 1440 / 900;
    transform: translateY(-50%);
    z-index: 1;
    pointer-events: none;
  }
  .mv-stage img, .mv-stage span { position: absolute; display: block; max-width: none; }

  .mv-ring-glow {
    width: calc(663 / 1440 * 100%); height: calc(663 / 900 * 100%);
    left: calc(700 / 1440 * 100%); top: calc(118 / 900 * 100%);
    border: 5px solid var(--white);
    border-radius: 500px;
    background: radial-gradient(70.71% 70.71% at 50% 50%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
    filter: blur(5px);
  }
  .mv-ring {
    width: calc(553 / 1440 * 100%); height: calc(553 / 900 * 100%);
    left: calc(755 / 1440 * 100%); top: calc(173 / 900 * 100%);
    border: 1px solid var(--white-50);
    border-radius: 500px;
  }

  .mv-micro  { width: calc(289.52 / 1440 * 100%); height: calc(221.76 / 900 * 100%); left: calc(862.4 / 1440 * 100%);  top: calc(124.08 / 900 * 100%); }
  .mv-char1  { width: calc(253.44 / 1440 * 100%); height: calc(395.12 / 900 * 100%); left: calc(911.68 / 1440 * 100%); top: calc(267.52 / 900 * 100%); }
  .mv-char2  { width: calc(181.28 / 1440 * 100%); height: calc(381.04 / 900 * 100%); left: calc(1133.44 / 1440 * 100%); top: calc(265.76 / 900 * 100%); }
  .mv-char3  { width: calc(216.48 / 1440 * 100%); height: calc(262.24 / 900 * 100%); left: calc(836 / 1440 * 100%);    top: calc(441.76 / 900 * 100%); }
  .mv-char4  { width: calc(292.16 / 1440 * 100%); height: calc(206.8 / 900 * 100%);  left: calc(1192.4 / 1440 * 100%); top: calc(462.88 / 900 * 100%); }

  .mv-star1 { width: calc(17.6 / 1440 * 100%);  height: calc(16.72 / 900 * 100%); left: calc(1018.16 / 1440 * 100%); top: calc(209.44 / 900 * 100%); }
  .mv-star2 { width: calc(22.88 / 1440 * 100%); height: calc(23.76 / 900 * 100%); left: calc(836.88 / 1440 * 100%);  top: calc(441.76 / 900 * 100%); }
  .mv-star3a { width: calc(21.12 / 1440 * 100%); height: calc(21.12 / 900 * 100%); left: calc(1411.52 / 1440 * 100%); top: calc(447.04 / 900 * 100%); }
  .mv-star3b { width: calc(34.32 / 1440 * 100%); height: calc(35.2 / 900 * 100%);  left: calc(1429.12 / 1440 * 100%); top: calc(404.8 / 900 * 100%); }
  .mv-star4 { width: calc(23.76 / 1440 * 100%); height: calc(24.64 / 900 * 100%); left: calc(1257.52 / 1440 * 100%); top: calc(221.76 / 900 * 100%); }

  /* Scroll button */
  .btn-scroll {
    position: absolute;
    left: 50%;
    bottom: 64px;
    transform: translateX(-50%);
    width: 80px; height: 80px;
    padding: 0;
    border: 0;
    border-radius: 500px;
    background: var(--white-10);
    box-shadow: inset 4px 4px 10px rgba(255,255,255,0.4), inset -4px -4px 10px rgba(0,0,0,0.1);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
    transition: background var(--transition);
  }
  .btn-scroll::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 500px;
    background: linear-gradient(132.3deg, rgba(255,255,255,0.8) 12.7%, rgba(255,255,255,0) 86.3%);
    z-index: -1;
  }
  .btn-scroll svg { width: 40px; height: 40px; }
  .btn-scroll svg path { stroke: var(--white); transition: stroke var(--transition); }
  .btn-scroll:hover { background: var(--white); }
  .btn-scroll:hover svg path { stroke: var(--red); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ===== Responsive (Desktop First / max-width) ===== */

  /* ----- Tablet : 1024px 이하 ----- */
  @media (max-width: 1024px) {
    .header { height: 90px; }
    .header .inner { height: 90px; padding: 0 clamp(28px, 4vw, 40px); }
    .logo, .logo img { width: 160px; height: 27px; }

    .gnb, .gnb-list, .gnb-list li { height: 90px; }
    .gnb-list { gap: clamp(16px, 2.5vw, 30px); }
    .gnb-list a { font-size: clamp(15px, 2vw, 17px); }
    .gnb-apply { padding-left: clamp(16px, 2.5vw, 30px); }
    .btn-apply { height: 44px; padding: 0 18px; font-size: 16px; }

    /* 히어로: 텍스트 위 / 비주얼 아래 세로 배치 (스테이지는 기준점(1160,124)을 중심으로 축소) */
    .main-visual {
      --mv-top: 478px;     /* 캐릭터 상단 y */
      --mv-scale: 0.7;     /* 스테이지 축소 비율 */
      --mv-bottom: 110px;  /* 캐릭터 하단 ~ 섹션 하단 여백 */
      height: calc(var(--mv-top) + 580px * var(--mv-scale) + var(--mv-bottom));
      min-height: 0;
    }
    .mv-text { position: relative; left: auto; top: auto; transform: none; width: auto; padding: 100px 40px 0; gap: 40px; }
    .mv-info { gap: 20px; }
    .mv-season { font-size: 27px; line-height: 38px; letter-spacing: -0.56px; }
    .mv-title .emphasis { font-size: 56px; line-height: 64px; letter-spacing: -1.36px; }
    .mv-title .sub { font-size: 36px; line-height: 52px; letter-spacing: -0.88px; }
    .btn-cta { height: 64px; font-size: 20px; line-height: 30px; }

    .mv-stage {
      /* 태블릿·모바일은 기존 1440 x 900 좌표와 축소 배율 유지 */
      width: 1440px;
      height: 900px;
      left: calc(50% - 1160px);
      right: auto;
      top: calc(var(--mv-top) - 124px);
      transform: scale(var(--mv-scale));
      transform-origin: 1160px 124px;
    }

    .btn-scroll { width: 64px; height: 64px; bottom: 36px; }
    .btn-scroll svg { width: 32px; height: 32px; }
  }

  /* ----- 헤더 공간 확보: 767px 이하부터 햄버거 메뉴 (391~767px 구간 헤더 넘침 방지) ----- */
  @media (max-width: 767px) {
    .main-visual { --mv-scale: 0.6; }

    .header { height: 64px; }
    .header .inner { height: 64px; padding: 0 20px; }
    .logo, .logo img { width: 130px; height: 22px; }

    /* 헤더 우측: 지원하기 + 햄버거 */
    .header-m { display: flex; align-items: center; }
    .header-m .btn-apply { height: 32px; padding: 0 12px; font-size: 12px; line-height: 18px; letter-spacing: -0.26px; }
    .btn-menu, .btn-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--black);
    }
    .btn-menu { margin-right: -10px; }
    .btn-menu svg, .btn-close svg { width: 24px; height: 24px; }

    /* 전체 메뉴: 오른쪽에서 슬라이드 */
    .gnb {
      position: fixed;
      top: 0; right: 0;
      z-index: 20;
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding-top: 64px;
      background: var(--white);
      overflow-y: auto;
      overscroll-behavior: contain;
      transform: translateX(100%);
      visibility: hidden;
      transition: transform 0.35s ease, visibility 0s linear 0.35s;
    }
    .gnb.is-open {
      transform: translateX(0);
      visibility: visible;
      transition: transform 0.35s ease, visibility 0s;
    }
    .gnb::before {   /* 메뉴 상단 로고 (헤더 로고와 동일 위치) */
      content: "";
      position: absolute;
      top: 0; left: 20px;
      width: 130px; height: 64px;
      background: url('./images/logo.svg') left center / 130px 22px no-repeat;
    }
    .gnb::after {    /* 우측 하단 캐릭터 */
      content: "";
      position: absolute;
      right: 12px; bottom: 0;
      width: 140px; height: 144px;
      background: url('./images/mo_menu_char.png') center bottom / contain no-repeat;
      pointer-events: none;
    }
    .btn-close { position: absolute; top: 10px; right: 10px; }

    .gnb-list { display: block; height: auto; margin: 32px 20px 0; }
    .gnb-list li { display: block; height: auto; border-bottom: 1px solid #E5E5E5; }
    .gnb-list a { display: block; padding: 16px 0; font-size: 18px; line-height: 26px; }
    .gnb-apply { padding: 36px 20px 0; }
    .gnb-apply .btn-apply { display: flex; width: 100%; height: 48px; font-size: 17.4px; }

    body.is-menu-open { overflow: hidden; }
  }

  /* ----- Mobile : 390px 이하 ----- */
  @media (max-width: 390px) {
    .main-visual { --mv-top: 454px; --mv-scale: 0.5; --mv-bottom: 54px; }

    .mv-text { padding: 100px 20px 0; gap: 52px; }
    .mv-season { font-size: 20px; line-height: 30px; letter-spacing: -0.42px; }
    .mv-title .emphasis { font-size: 54px; line-height: 62px; letter-spacing: -1.32px; }
    .mv-title .sub { font-size: 35px; line-height: 50px; letter-spacing: -0.86px; }
    .mv-period { font-size: 12.5px; line-height: 20px; letter-spacing: -0.26px; }
    .btn-cta { width: 200px; height: 48px; padding: 0; font-size: 15px; line-height: 24px; }

    .btn-scroll { width: 40px; height: 40px; bottom: 16px; }
    .btn-scroll svg { width: 24px; height: 24px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="inner">
    <a href="./" class="logo" aria-label="Hanmi 한미그룹 홈">
      <img src="./images/logo.svg" alt="Hanmi 한미그룹" width="182" height="31">
    </a>
    <nav class="gnb" id="gnb" aria-label="주요 메뉴">
      <button type="button" class="btn-close" aria-label="전체 메뉴 닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <ul class="gnb-list">
        <li><a href="#jobs">직무소개</a></li>
        <li><a href="#qualification">지원자격 및 접수방법</a></li>
        <li><a href="#schedule">채용설명회 일정</a></li>
      </ul>
      <div class="gnb-apply">
        <a href="#apply" class="btn-apply">
          지원하기
          <svg viewBox="0 0 7 12" fill="none" aria-hidden="true"><path d="M1 1l5 5-5 5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </nav>
    <div class="header-m">
      <a href="#apply" class="btn-apply">지원하기</a>
      <button type="button" class="btn-menu" aria-label="전체 메뉴 열기" aria-controls="gnb" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="main-visual" id="main_visual" aria-label="2026년 하반기 한미그룹 공개채용">
    <div class="inner">

      <!-- 캐릭터/장식 스테이지 -->
      <div class="mv-stage" aria-hidden="true">
        <span class="mv-ring-glow"></span>
        <span class="mv-ring"></span>
        <img class="mv-micro" src="./images/mv_micro.png" alt="">
        <img class="mv-char1" src="./images/mv_char1.png" alt="">
        <img class="mv-char2" src="./images/mv_char2.png" alt="">
        <img class="mv-char3" src="./images/mv_char3.png" alt="">
        <img class="mv-char4" src="./images/mv_char4.png" alt="">
        <img class="mv-star1" src="./images/mv_star1.png" alt="">
        <img class="mv-star2" src="./images/mv_star2.png" alt="">
        <img class="mv-star3a" src="./images/mv_star3.png" alt="">
        <img class="mv-star3b" src="./images/mv_star3.png" alt="">
        <img class="mv-star4" src="./images/mv_star4.png" alt="">
      </div>

      <!-- 텍스트 -->
      <div class="mv-text">
        <div class="mv-info">
          <p class="mv-season">2026년 하반기</p>
          <h1 class="mv-title">
            <span class="emphasis">한미그룹</span>
            <span class="sub">공개채용</span>
          </h1>
          <p class="mv-period">모집기간 : 2026.9.28(월) ~ 2026.10.18(일) 23:59까지</p>
        </div>
        <a href="#jobs" class="btn-cta">모집직무 바로가기!</a>
      </div>

    </div>

    <button type="button" class="btn-scroll" id="scrollDown" aria-label="아래로 스크롤">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M12 16l8 8 8-8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </section>
</main>

<footer class="footer">
  <!-- 하단 푸터 콘텐츠 영역 -->
</footer>

<script>
  (function () {
    var btn = document.getElementById('scrollDown');
    var visual = document.getElementById('main_visual');
    if (btn && visual) {
      btn.addEventListener('click', function () {
        window.scrollTo({ top: visual.offsetHeight, behavior: 'smooth' });
      });
    }
  })();

  /* 모바일 전체 메뉴 */
  (function () {
    var gnb = document.getElementById('gnb');
    var btnOpen = document.querySelector('.btn-menu');
    var btnClose = document.querySelector('.btn-close');
    if (!gnb || !btnOpen || !btnClose) return;

    var mq = window.matchMedia('(max-width: 767px)');

    function setMenu(open, moveFocus) {
      gnb.classList.toggle('is-open', open);
      document.body.classList.toggle('is-menu-open', open);
      btnOpen.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (moveFocus) (open ? btnClose : btnOpen).focus({ preventScroll: true });
    }

    btnOpen.addEventListener('click', function () { setMenu(true, true); });
    btnClose.addEventListener('click', function () { setMenu(false, true); });

    // 메뉴 링크 클릭 시 닫기 (앵커 이동 전에 스크롤 잠금 해제)
    gnb.addEventListener('click', function (e) {
      if (e.target.closest('a')) setMenu(false, false);
    });

    document.addEventListener('keydown', function (e) {
      if (!gnb.classList.contains('is-open')) return;
      if (e.key === 'Escape') { setMenu(false, true); return; }
      if (e.key !== 'Tab') return;
      // 열린 메뉴 안에서 포커스 순환
      var items = gnb.querySelectorAll('a[href], button');
      var first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });

    // 화면이 넓어지면 열린 상태 초기화 (스크롤 잠금 해제)
    function onChange(e) { if (!e.matches) setMenu(false, false); }
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else mq.addListener(onChange);
  })();
</script>
</body>
</html>
